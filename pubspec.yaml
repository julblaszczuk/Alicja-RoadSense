name: alicja_roadsense
description: AI-powered driving assistant with collision detection and real-time alerts
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Camera & Vision
  camera: ^0.11.0+2
  tflite_flutter: ^0.11.0
  image: ^4.2.0

  # Location & Sensors
  geolocator: ^13.0.1
  sensors_plus: ^6.0.1

  # Navigation & Maps
  mapbox_maps_flutter: ^2.3.0
  flutter_compass: ^0.8.0

  # Database
  sqflite: ^2.3.3+2
  path_provider: ^2.1.4

  # UI Components
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0

  # Utilities
  uuid: ^4.5.1
  intl: ^0.19.0
  logger: ^2.4.0
  permission_handler: ^11.3.1
  vibration: ^2.0.0
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.4.3
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  adaptive_icon_background: "#0A0E1A"
  adaptive_icon_foreground: "assets/icon.png"

dependency_overrides:
  geolocator_android: 4.6.2

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/logo.svg
    - assets/sounds/
    - models/mobilenet_ssd.tflite
    - models/labelmap.txt
